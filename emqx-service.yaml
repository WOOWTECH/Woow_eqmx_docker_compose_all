apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: emqx
  labels:
    app: emqx
spec:
  type: NodePort
  selector:
    app: emqx
  ports:
    - name: mqtt-tcp
      port: 1883
      targetPort: 1883
      nodePort: 31883
      protocol: TCP
    - name: mqtt-ssl
      port: 8883
      targetPort: 8883
      protocol: TCP
    - name: mqtt-ws
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: mqtt-wss
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: dashboard
      port: 18083
      targetPort: 18083
      nodePort: 31808
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-headless
  namespace: emqx
  labels:
    app: emqx
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: emqx
  ports:
    - name: mqtt-tcp
      port: 1883
      targetPort: 1883
      protocol: TCP
    - name: mqtt-ssl
      port: 8883
      targetPort: 8883
      protocol: TCP
    - name: mqtt-ws
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: mqtt-wss
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: dashboard
      port: 18083
      targetPort: 18083
      protocol: TCP
